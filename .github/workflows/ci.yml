name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/web/package-lock.json
      # The Go build embeds ui/web/dist, so the frontend is built first.
      - name: Frontend
        working-directory: ui/web
        run: npm ci && npm run build && npm test
      - name: Go vet and tests
        run: go vet ./... && go test ./...
